<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0ea5e9" />
<title>ToolNest — صندوق أدواتك اليومية</title>
<meta name="description" content="مجموعة أدوات ويب تعمل محليًا في متصفحك: JSON، Base64، JWT، Hash، ألوان، وغيرها. مجانًا، بدون رفع ملفات، بالعربية والإنجليزية." />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skip">تخطَّ إلى المحتوى</a>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" aria-label="ToolNest">
        <span class="brand-logo">🪺</span>
        <span class="brand-name">ToolNest</span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="#/tools" data-i18n="nav.allTools">كل الأدوات</a>
        <a href="#/favorites" data-i18n="nav.favorites">المفضلة</a>
        <a href="#/about" data-i18n="nav.about">حول</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <button id="lang-toggle" class="icon-btn" aria-label="Toggle language">EN</button>
      </div>
    </div>
  </header>

  <main id="main" class="container" role="main"><!-- يُعبأ عبر الراوتر --></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> ToolNest — <span data-i18n="footer.local">يعمل محليًا في متصفحك</span></span>
    </div>
  </footer>

  <!-- نافذة سريعة اختيارية -->
  <div id="quick-modal" class="modal" hidden aria-modal="true" role="dialog">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="document">
      <button class="modal-close icon-btn" data-close aria-label="Close">✕</button>
      <div id="quick-modal-body"></div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
