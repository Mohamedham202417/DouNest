<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolNest — Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body dir="rtl">
  <header class="topbar" id="top">
    <a class="brand" href="index.html" aria-label="ToolNest — الرئيسية">
      <span class="brand-mark" aria-hidden="true">✳</span>
      <span>Tool<span class="brand-accent">Nest</span></span>
    </a>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="تبديل المظهر">☼</button>
      <button id="langBtn" class="ghost-btn" type="button">EN</button>
      <a class="nav-cta" href="index.html#tools"><span>كل الأدوات</span></a>
    </div>
  </header>

  <main class="tools-section" style="padding-top:0;">
    <p class="hero-copy" style="text-align:start;max-width:none;margin:0 0 16px;">رابط مباشر لأداة واحدة. يمكنك مشاركة هذا الرابط للوصول السريع.</p>
  </main>

  <div
    id="toolModal"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-hidden="false"
  >
    <div class="modal" role="document">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <a href="index.html#tools" class="secondary-btn" style="text-decoration:none;">رجوع</a>
        <button id="closeModal" class="close-btn" type="button" aria-label="إغلاق">×</button>
      </div>
      <div id="toolBody" class="tool-body"></div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </div>
  </div>

  <input id="searchInput" type="search" class="hidden">
  <div id="categoryRow" class="hidden"></div>
  <span id="toolCount" class="hidden"></span>
  <p id="noResults" class="hidden"></p>
  <span id="year" class="hidden"></span>

  <script src="app.js" defer></script>
</body>
</html>
