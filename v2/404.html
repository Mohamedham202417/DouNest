<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script>
  // تحويل المسارات النظيفة إلى Hash Router
  (function(){
    var p = location.pathname.replace(/^\/DouNest/, "") || "/";
    location.replace("/DouNest/#" + p + location.search + location.hash);
  })();
</script></head><body></body></html>
